# PostgreSQL. Connection is driven entirely by DATABASE_URL — never hardcode
# credentials here. Set DATABASE_URL in the environment before running
# `bin/rails db:migrate`/`bin/rails server`/`bin/rails test`.
#
#   export DATABASE_URL="postgres://user:password@host:5432/dbname"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] || ENV["DATABASE_URL"] %>

production:
  primary:
    <<: *default
  cache:
    <<: *default
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    migrations_paths: db/cable_migrate
